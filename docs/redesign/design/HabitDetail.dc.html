<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Habit Detail</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lq.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4f46e5}a:hover{color:#4338ca}
</style>
</helmet>
<div class="lq screen {{theme}}" style="width: 375px; height: 1180px">
  <header class="hdr" style="padding: 0 8px">
    <a class="btn btn-icon" href="Habits.dc.html" aria-label="Volver a Hábitos"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <button class="btn btn-icon" aria-label="Editar hábito"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L20 8l-4-4L4 16z"></path></svg></button>
  </header>
  <main class="enter" style="display: flex; flex-direction: column; gap: 24px; padding: 0 16px 128px">
    <section style="display: flex; flex-direction: column; gap: 16px">
      <div class="ichip primary lg"><svg class="i i48" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"></path></svg></div>
      <div>
        <h1 class="t-ds">Leer 20 páginas</h1>
        <p class="t-bm c-3">Diario · desde el 12 de agosto</p>
      </div>
      <div class="row" style="gap: 8px; flex-wrap: wrap"><span class="badge badge-primary">Aprendizaje</span><span class="badge badge-success"><svg class="i i16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>+10 XP / día</span></div>
    </section>

    <section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px" aria-label="Estadísticas">
      <div class="card" style="display: flex; flex-direction: column; gap: 4px; padding: 16px 12px">
        <svg class="i c-warning" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-9-1 2-2 3-4 3 0-2-1-4-2-5-1 4-4 6-4 11 0 4 3 7 7 7z"></path></svg>
        <span class="t-hl num">14</span><span class="t-bs c-3">Racha</span>
      </div>
      <div class="card" style="display: flex; flex-direction: column; gap: 4px; padding: 16px 12px">
        <svg class="i c-success" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12 2.5 2.5 4.5-5"></path></svg>
        <span class="t-hl num">43</span><span class="t-bs c-3">Completados</span>
      </div>
      <div class="card" style="display: flex; flex-direction: column; gap: 4px; padding: 16px 12px">
        <svg class="i c-primary" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>
        <span class="t-hl num">86%</span><span class="t-bs c-3">Éxito</span>
      </div>
    </section>

    <section class="card" style="display: flex; flex-direction: column; gap: 16px">
      <div class="row" style="justify-content: space-between"><h2 class="t-hs">Últimos 7 días</h2><span class="t-bs c-3">6 / 7</span></div>
      <ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
          <li style="display: flex; flex-direction: column; align-items: center; gap: 8px" aria-label="{{d.aria}}">
            <span class="t-lm c-3">{{d.label}}</span>
            <span class="{{d.cls}}" style="width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="i i16" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.5"><path d="{{d.icon}}"></path></svg></span>
          </li>
        </sc-for>
      </ol>
      <div class="row" style="gap: 16px"><span class="row t-bs c-2" style="gap: 6px"><span class="ichip success" style="width: 16px; height: 16px; border-radius: 99px; background: var(--success)"></span>Completado</span><span class="row t-bs c-2" style="gap: 6px"><span style="width: 16px; height: 16px; border-radius: 99px; background: var(--surface-variant); border: 1px solid var(--border)"></span>Sin registrar</span></div>
    </section>

    <section class="card" style="display: flex; flex-direction: column; gap: 16px">
      <div class="row" style="justify-content: space-between"><h2 class="t-hs">Historial</h2><span class="t-bs c-3">Días por semana</span></div>
      <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; align-items: end; height: 140px" role="img" aria-label="Días completados por semana, últimas 8 semanas: 4, 5, 3, 6, 7, 6, 7, 6">
        <sc-for list="{{weeks}}" as="w" hint-placeholder-count="8">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end">
            <span class="t-lm c-2 num">{{w.v}}</span>
            <span style="width: 100%; height: {{w.h}}%; border-radius: 6px; background: {{w.bg}}"></span>
          </div>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px"><sc-for list="{{weeks}}" as="w" hint-placeholder-count="8"><span class="t-lm c-3" style="text-align: center">{{w.l}}</span></sc-for></div>
    </section>

    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button class="btn btn-secondary"><svg class="i i16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L20 8l-4-4L4 16z"></path></svg>Editar</button>
      <button class="btn btn-danger"><svg class="i i16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Eliminar</button>
    </section>
  </main>
  <nav class="tabbar" aria-label="Principal">
    <a href="Dashboard.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="Habits.dc.html" class="on" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12 2.5 2.5 4.5-5"></path></svg>Hábitos</a>
    <a href="Quests.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22V4"></path><path d="M5 4h12l-2.5 4L17 12H5"></path></svg>Misiones</a>
    <a href="Colosseum.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M9.5 17.5 21 6V3h-3L6.5 14.5M11 19l-6-6M8 16l-4 4M5 21l-2-2"></path></svg>Coliseo</a>
    <a href="Profile.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":375,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const days = [['L',1],['M',1],['X',1],['J',0],['V',1],['S',1],['D',1]];
    const week = days.map(([label, ok]) => ({
      label, aria: label + (ok ? ': completado' : ': sin registrar'),
      cls: ok ? 'ichip success' : 'ichip muted',
      icon: ok ? 'm5 12 5 5 9-10' : 'M8 12h8',
    }));
    const vals = [4,5,3,6,7,6,7,6];
    const weeks = vals.map((v, i) => ({ v, h: Math.round(v / 7 * 80), l: 'S' + (i + 1),
      bg: i === vals.length - 1 ? 'var(--primary)' : 'var(--primary-soft)' }));
    return { theme: (this.props.dark ?? false) ? 'dark' : '', week, weeks };
  }
}
</script>
</body>
</html>
