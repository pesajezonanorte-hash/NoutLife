<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Finances</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lq.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4f46e5}a:hover{color:#4338ca}
</style>
</helmet>
<div class="lq screen {{theme}}" style="width: 375px; height: 1260px">
  <header class="hdr" style="padding: 0 8px">
    <a class="btn btn-icon" href="Dashboard.dc.html" aria-label="Volver"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <button class="btn btn-secondary btn-sm" aria-label="Cambiar mes, actual octubre 2026">Octubre 2026<svg class="i i16" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  </header>

  <sc-if value="{{hasData}}" hint-placeholder-val="{{ true }}">
  <main class="enter" style="display: flex; flex-direction: column; gap: 24px; padding: 0 16px 128px">
    <h1 class="t-ds">Finanzas</h1>
    <section class="card card-elevated card-lg" style="display: flex; flex-direction: column; gap: 4px" aria-label="Saldo">
      <span class="t-bs c-3">Saldo del mes</span>
      <span class="t-dl num">$1.240</span>
      <span class="row t-bs c-success" style="gap: 4px"><svg class="i i16" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>+12% vs. septiembre</span>
    </section>
    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <div class="card" style="display: flex; flex-direction: column; gap: 8px">
        <div class="ichip success" style="width: 40px; height: 40px; border-radius: 12px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 7 7 17M16 17H7V8"/></svg></div>
        <span class="t-bs c-3">Ingresos</span><span class="t-hm num">$2.800</span>
      </div>
      <div class="card" style="display: flex; flex-direction: column; gap: 8px">
        <div class="ichip error" style="width: 40px; height: 40px; border-radius: 12px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></div>
        <span class="t-bs c-3">Gastos</span><span class="t-hm num">$1.560</span>
      </div>
    </section>
    <section class="card" style="display: flex; flex-direction: column; gap: 16px">
      <div class="row" style="justify-content: space-between"><h2 class="t-hs">Gastos · 7 días</h2><span class="t-bs c-3 num">$412</span></div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 132px" role="img" aria-label="Gastos diarios: lunes 42, martes 18, miércoles 96, jueves 30, viernes 128, sábado 64, domingo 34 dólares. Máximo el viernes.">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <div style="display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%">
            <span class="t-lm num {{d.vc}}">{{d.label}}</span>
            <span style="width: 100%; height: {{d.h}}%; border-radius: 6px; background: {{d.bg}}"></span>
          </div>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px"><sc-for list="{{days}}" as="d" hint-placeholder-count="7"><span class="t-lm c-3" style="text-align: center">{{d.day}}</span></sc-for></div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 16px">
      <div class="row" style="justify-content: space-between"><h2 class="t-hs">Movimientos</h2><a class="link" href="#">Ver todos</a></div>
      <ul class="card" style="list-style: none; margin: 0; padding: 4px 16px; display: flex; flex-direction: column">
        <sc-for list="{{tx}}" as="t" hint-placeholder-count="5">
          <li class="row" style="gap: 12px; min-height: 64px; border-bottom: {{t.border}}">
            <div class="ichip {{t.tone}}" style="width: 40px; height: 40px; border-radius: 12px"><svg class="i i16" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="{{t.icon}}"/></svg></div>
            <div style="flex: 1; min-width: 0"><div class="t-ll" style="font-size: 16px">{{t.name}}</div><div class="t-bs c-3">{{t.meta}}</div></div>
            <span class="t-ll num {{t.amtCls}}" style="font-size: 16px">{{t.amt}}</span>
          </li>
        </sc-for>
      </ul>
    </section>
  </main>
  </sc-if>

  <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
  <main style="display: flex; flex-direction: column; gap: 24px; padding: 0 16px 128px">
    <h1 class="t-ds">Finanzas</h1>
    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding: 96px 16px">
      <div class="ichip info lg"><svg class="i i48" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/></svg></div>
      <h2 class="t-hl">Sin movimientos</h2>
      <p class="t-bm c-3">Registra tu primer gasto o ingreso.</p>
      <button class="btn btn-primary"><svg class="i i16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Transacción</button>
    </div>
  </main>
  </sc-if>

  <button class="fab" aria-label="Nueva transacción"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabbar" aria-label="Principal">
    <a href="Dashboard.dc.html" class="on" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
    <a href="Habits.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>Hábitos</a>
    <a href="Quests.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22V4"/><path d="M5 4h12l-2.5 4L17 12H5"/></svg>Misiones</a>
    <a href="Colosseum.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M9.5 17.5 21 6V3h-3L6.5 14.5M11 19l-6-6M8 16l-4 4M5 21l-2-2"/></svg>Coliseo</a>
    <a href="Profile.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"empty":{"editor":"boolean","default":false},"$preview":{"width":375,"height":1260}}'>
class Component extends DCLogic {
  renderVals() {
    const vals = [['L',42],['M',18],['X',96],['J',30],['V',128],['S',64],['D',34]];
    const max = 128;
    const days = vals.map(([day, v]) => ({ day, label: '$' + v, h: Math.round(v / max * 78),
      bg: v === max ? 'var(--error)' : 'var(--surface-variant)', vc: v === max ? 'c-error' : 'c-3' }));
    const ICO = {
      food: 'M7 3v18M4 3v6a3 3 0 0 0 6 0V3M17 21V3c-2 1-3 4-3 7h3',
      in: 'M17 7 7 17M16 17H7V8',
      car: 'M5 17h14M6 17v2M18 17v2M4 13l2-6h12l2 6v4H4z',
      book: 'M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z',
      bolt: 'M13 2 4 14h7l-1 8 9-12h-7z',
    };
    const tx = [
      ['Supermercado','Comida · Hoy, 10:24','−$64,20','food','warning',0],
      ['Pago freelance','Ingreso · Ayer','+$800,00','in','success',1],
      ['Transporte','Movilidad · 30 sep','−$18,50','car','info',0],
      ['Curso de diseño','Educación · 29 sep','−$49,00','book','primary',0],
      ['Electricidad','Servicios · 28 sep','−$72,30','bolt','secondary',0],
    ].map(([name,meta,amt,icon,tone,pos], i) => ({ name, meta, amt, icon: ICO[icon], tone,
      amtCls: pos ? 'c-success' : 'c-1', border: i < 4 ? '1px solid var(--border)' : '0' }));
    const empty = this.props.empty ?? false;
    return { theme: (this.props.dark ?? false) ? 'dark' : '', days, tx, hasData: !empty, isEmpty: empty };
  }
}
</script>
</body>
</html>
