<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lq.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--primary-text)}a:hover{color:var(--primary-hover)}
</style>
</helmet>
<div class="lq screen {{theme}}" style="width: 375px; height: 1180px; transition: background-color .3s, color .3s">
  <header class="hdr">
    <span class="t-bs c-3">Perfil</span>
    <button class="btn btn-icon" aria-label="Editar perfil"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L20 8l-4-4L4 16z"></path></svg></button>
  </header>
  <main class="enter" style="display: flex; flex-direction: column; gap: 24px; padding: 0 16px 128px">
    <section style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px">
      <div style="width: 96px; height: 96px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-text); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--primary)" role="img" aria-label="Avatar de Alex Rivera"><span class="t-hl">AR</span></div>
      <div>
        <h1 class="t-hl">Alex Rivera</h1>
        <p class="t-bm c-3">Nivel 12 · Aventurero</p>
      </div>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 6px">
        <div class="bar lg" role="progressbar" aria-label="Experiencia" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100"><span style="width: 78%"></span></div>
        <div class="row" style="justify-content: space-between"><span class="t-bs c-3 num">2.340 XP</span><span class="t-bs c-3 num">3.000 XP</span></div>
      </div>
    </section>

    <section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px" aria-label="Estadísticas">
      <a class="card card-hover" href="Quests.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; text-decoration: none; color: inherit">
        <svg class="i c-primary" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22V4"></path><path d="M5 4h12l-2.5 4L17 12H5"></path></svg>
        <span class="t-hl num">34</span><span class="t-bs c-3">Misiones</span>
      </a>
      <a class="card card-hover" href="Habits.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; text-decoration: none; color: inherit">
        <svg class="i c-warning" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-9-1 2-2 3-4 3 0-2-1-4-2-5-1 4-4 6-4 11 0 4 3 7 7 7z"></path></svg>
        <span class="t-hl num">21</span><span class="t-bs c-3">Mejor racha</span>
      </a>
      <a class="card card-hover" href="Achievements.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; text-decoration: none; color: inherit">
        <svg class="i c-success" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
        <span class="t-hl num">62</span><span class="t-bs c-3">Días seguidos</span>
      </a>
    </section>

    <a class="card card-hover row" href="Achievements.dc.html" style="gap: 16px; text-decoration: none; color: inherit">
      <div class="ichip warning"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg></div>
      <div style="flex: 1"><div class="t-ll" style="font-size: 16px">Logros</div><div class="t-bs c-3">4 de 8 desbloqueados</div></div>
      <svg class="i c-3" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 class="t-hs">Ajustes</h2>
      <div class="card" style="padding: 4px 16px; display: flex; flex-direction: column">
        <div class="row" style="gap: 12px; min-height: 64px; border-bottom: 1px solid var(--border)">
          <svg class="i c-2" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg>
          <label for="pf-notif" class="t-bm" style="flex: 1">Notificaciones</label>
          <span class="switch"><input id="pf-notif" type="checkbox" checked="" role="switch"><span></span></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border)">
          <div class="row" style="gap: 12px"><svg class="i c-2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg><span class="t-bm" id="pf-theme">Tema</span></div>
          <div class="seg" role="radiogroup" aria-labelledby="pf-theme">
            <sc-for list="{{modes}}" as="m" hint-placeholder-count="3"><button class="{{m.cls}}" role="radio" aria-checked="{{m.sel}}" onClick="{{m.pick}}">{{m.label}}</button></sc-for>
          </div>
        </div>
        <a class="row" href="#" style="gap: 12px; min-height: 64px; text-decoration: none; color: inherit">
          <svg class="i c-2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
          <span class="t-bm" style="flex: 1">Idioma</span><span class="t-bs c-3">Español</span>
          <svg class="i c-3" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
        </a>
      </div>
    </section>

    <button class="btn btn-danger btn-block"><svg class="i i16" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg>Cerrar sesión</button>
  </main>
  <nav class="tabbar" aria-label="Principal">
    <a href="Dashboard.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="Habits.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12 2.5 2.5 4.5-5"></path></svg>Hábitos</a>
    <a href="Quests.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22V4"></path><path d="M5 4h12l-2.5 4L17 12H5"></path></svg>Misiones</a>
    <a href="Colosseum.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M9.5 17.5 21 6V3h-3L6.5 14.5M11 19l-6-6M8 16l-4 4M5 21l-2-2"></path></svg>Coliseo</a>
    <a href="Profile.dc.html" class="on" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":375,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: null }; }
  renderVals() {
    const mode = this.state.mode ?? ((this.props.dark ?? false) ? 'dark' : 'light');
    const modes = [['light','Claro'],['dark','Oscuro'],['auto','Auto']].map(([id,label]) => ({
      label, cls: mode === id ? 'on' : '', sel: mode === id ? 'true' : 'false', pick: () => this.setState({ mode: id }) }));
    return { theme: mode === 'dark' ? 'dark' : '', modes };
  }
}
</script>
</body>
</html>
