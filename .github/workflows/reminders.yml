# Dispara los recordatorios (hábitos, agenda, misiones por vencer, resumen diario).
# La API corre en Vercel (serverless) y no tiene procesos en segundo plano, así que
# algo externo debe llamar a /api/v1/cron/tick cada pocos minutos.
#
# Secretos del repositorio necesarios:
#   REMINDERS_API_URL  p. ej. https://lifequest2-api.vercel.app
#   CRON_SECRET        el mismo valor que la variable CRON_SECRET de la API
#
# GitHub puede retrasar los cron unos minutos; la API acepta avisos con hasta 30 min
# de retraso y nunca envía uno dos veces. Para puntualidad al minuto, usa además
# cron-job.org con la URL  <API>/api/v1/cron/tick?key=<CRON_SECRET>.
name: Recordatorios

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Disparar recordatorios
        env:
          API_URL: ${{ secrets.REMINDERS_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secretos REMINDERS_API_URL o CRON_SECRET; no se dispara nada."
            exit 0
          fi
          curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "$API_URL/api/v1/cron/tick"
