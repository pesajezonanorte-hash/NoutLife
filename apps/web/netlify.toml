# La API en el mismo dominio: cookie de sesión de primera parte (Safari/iPhone).
[[redirects]]
  from = "/api/v1/*"
  to = "https://lifequest2-api.vercel.app/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm run build"
  publish = "dist"
  base = "apps/web"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
