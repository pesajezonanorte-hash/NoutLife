    <title>NoutLife — Tu rutina, tu mente y tus ideas en un solo lugar</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NoutLife",
        "alternateName": ["Noutlife"],
        "description": "Tu rutina, tu mente y tus ideas en un solo lugar: hábitos, libreta, bienestar y metas en un espacio en calma.",
        "inLanguage": "es",
        "url": "https://noutlife.site/",
        "image": "https://noutlife.site/og-image.png",
        "logo": "https://noutlife.site/icon.png"
      }
    </script>
    <meta name="google-site-verification" content="MyC3ZB7BGWD83R2TcF2oML6OxFE8rnFUE066NGibsAY" />
    <!-- Tema antes del primer pintado (misma lógica que store/themeStore) -->
    <script>
      try {
        var t = (JSON.parse(localStorage.getItem('lq-theme') || 'null') || {}).state || {};
        var m = t.mode;
        if (!m) { var l = localStorage.getItem('theme'); m = l === 'dark' ? 'dark' : l === 'light' ? 'light' : 'auto'; }
        var d = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        // Un tema de la Tienda fija su esquema (skinDark) y su data-theme.
        if (t.skin && typeof t.skinDark === 'boolean') { d = t.skinDark; document.documentElement.setAttribute('data-theme', t.skin); }
        document.documentElement.classList.add(d ? 'dark' : 'light');
        // Halloween para el splash (misma fecha que lib/season.ts).
        if (new Date() <= new Date('2026-10-31T23:59:59')) document.documentElement.setAttribute('data-season', 'halloween');
      } catch (e) {}
    </script>
    <!-- «Reducir movimiento» de la app antes del primer pintado (store/motionStore). -->
    <script>
      try { if ((JSON.parse(localStorage.getItem('lq-motion') || 'null') || {}).state.reduce) document.documentElement.classList.add('lq-rm'); } catch (e) {}
    </script>
    <!-- Splash de arranque: las tres hojas del logo vuelan, giran y se asientan formando la N; después aparece
         «noutlife» letra a letra. Es CSS puro, para que empiece en el primer pintado, antes del JS. Cuando la app
         está lista, src/splash/hero.ts (un Worker) funde esa N en líquido hasta el logo de la cabecera. -->
    <style>
      #lq-boot { --bg: var(--lq-background, 249 247 243); --fg: var(--lq-on-background, 14 29 22); --mt: var(--lq-on-surface-light, 79 107 92); --pr: var(--lq-primary, 30 54 41);
        --a0: var(--lq-brand-a0, #5fae97); --a1: var(--lq-brand-a1, #2f7565); --a2: var(--lq-brand-a2, #0a3a33); --a3: var(--lq-brand-a3, #05302b);
        --b0: var(--lq-brand-b0, #8ec7ad); --b1: var(--lq-brand-b1, #2c7362);
        --c0: var(--lq-brand-c0, #4f9c84); --c1: var(--lq-brand-c1, #2a6f60); --c2: var(--lq-brand-c2, #06302b);
        position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        padding: 0 16px; background-color: rgb(var(--bg)); color: rgb(var(--fg)); font-family: 'Nout Sans', system-ui, sans-serif; overflow: hidden;
        /* El fondo se va cuando la N ya se funde: la app aparece bajo la corriente, sin un corte. */
        transition: background-color .9s cubic-bezier(.4,0,.2,1); }
      #lq-boot.out { background-color: rgb(var(--bg) / 0); }
      /* La palabra y el eslogan se despiden despacio, después de que empiece el líquido. */
      /* .tg y .bar tienen animaciones de entrada con relleno «both», que fijan opacity:1 y anulan la transición:
         por eso se despiden con su propio fotograma de salida. */
      @keyframes lqb-fade { from { opacity: 1; } to { opacity: 0; } }
      #lq-boot.out .wm { opacity: 0; transition: opacity .7s cubic-bezier(.4,0,.2,1) .15s; }
      #lq-boot.out .tg, #lq-boot.out .bar { animation: lqb-fade .7s cubic-bezier(.4,0,.2,1) .15s forwards; }
      #lq-boot .mk { position: relative; width: 89px; height: 104px; animation: lqb-settle .6s cubic-bezier(.34,1.56,.64,1) 1.62s both; transition: opacity .3s ease-in; }
      /* El 3D toma la N en este mismo sitio: la de CSS se funde mientras la otra aparece. */
      #lq-boot.taken .mk { opacity: 0; }
      #lq-boot .mk svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; opacity: 0;
        animation: 1.45s cubic-bezier(.45,.05,.2,1) both; will-change: transform, opacity; }
      #lq-boot .mk .lb { animation-name: lqb-b; animation-delay: .05s; }
      #lq-boot .mk .la { animation-name: lqb-a; animation-delay: .12s; }
      #lq-boot .mk .lc { animation-name: lqb-c; animation-delay: .2s; }
      #lq-boot .rp { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%;
        border: 1.5px solid rgb(var(--pr) / .35); opacity: 0; animation: lqb-ripple 1.1s cubic-bezier(.16,1,.3,1) 1.62s forwards; }
      #lq-boot .wm { display: flex; font-size: 2.5rem; font-weight: 500; letter-spacing: -0.01em; line-height: 1; }
      #lq-boot .wm span { display: inline-block; opacity: 0; animation: lqb-letter .6s cubic-bezier(.16,1,.3,1) both; }
      #lq-boot .tg { font-size: .9375rem; color: rgb(var(--mt)); opacity: 0; animation: lqb-up .6s cubic-bezier(.16,1,.3,1) 1.7s both; }
      #lq-boot .bar { width: 120px; height: 2px; border-radius: 2px; background: rgb(var(--pr) / .12); overflow: hidden; opacity: 0; animation: lqb-up .4s ease-out 1.75s both; }
      #lq-boot .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: rgb(var(--pr)); animation: lqb-slide 1.3s cubic-bezier(.65,0,.35,1) 1.75s infinite; }
      #lq-boot-3d { position: fixed; inset: 0; z-index: 301; width: 100%; height: 100%; pointer-events: none; }
      /* Vuelo de cada hoja: entra desde un lado girando, deriva, se pasa un poco y se asienta. */
      @keyframes lqb-b { 0% { opacity: 0; transform: translate(-46vw, 22vh) rotate(-140deg) scale(.45); }
        18% { opacity: 1; } 55% { transform: translate(-90px, -110px) rotate(38deg) scale(.95); }
        82% { transform: translate(6px, 4px) rotate(-5deg) scale(1.02); } 100% { opacity: 1; transform: none; } }
      @keyframes lqb-a { 0% { opacity: 0; transform: translate(40vw, -34vh) rotate(170deg) scale(.4); }
        18% { opacity: 1; } 55% { transform: translate(120px, 70px) rotate(-34deg) scale(1.06); }
        82% { transform: translate(-5px, -3px) rotate(4deg) scale(.99); } 100% { opacity: 1; transform: none; } }
      @keyframes lqb-c { 0% { opacity: 0; transform: translate(34vw, 36vh) rotate(-210deg) scale(.5); }
        18% { opacity: 1; } 55% { transform: translate(-110px, 40px) rotate(28deg) scale(.92); }
        82% { transform: translate(4px, -5px) rotate(-4deg) scale(1.02); } 100% { opacity: 1; transform: none; } }
      @keyframes lqb-settle { 0% { transform: scale(1); } 40% { transform: scale(1.07); } 100% { transform: scale(1); } }
      @keyframes lqb-ripple { from { opacity: .9; transform: scale(.55); } to { opacity: 0; transform: scale(1.5); } }
      @keyframes lqb-letter { from { opacity: 0; transform: translateY(.5em) rotate(4deg); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
      @keyframes lqb-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes lqb-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      /* La página espera a que la N esté en su sitio: el barrido de los títulos y el ambiente repintan cada
         fotograma, y el GPU, que es uno solo, daba tirones al líquido. Al quitarse el splash, todo empieza a la vez. */
      html:has(#lq-boot) #root *, html:has(#lq-boot) #root *::before, html:has(#lq-boot) #root *::after { animation-play-state: paused !important; }
      /* El logo de la cabecera no se ve hasta que llega la N: entonces la releva, ya idéntica. */
      html:has(#lq-boot) [data-brand-mark] { opacity: 0; }
      html:has(#lq-boot.landed) [data-brand-mark] { opacity: 1; transition: opacity .18s linear; }
      /* Reducir movimiento: todo aparece ya montado, solo con un fundido. */
      html.lq-rm #lq-boot *, html.lq-rm #lq-boot .mk svg { animation: lqb-up .3s ease-out both !important; }
      html.lq-rm #lq-boot .rp { display: none; }
    </style>
  </head>
  <body>
    <div id="lq-boot" role="status" aria-label="Cargando Noutlife">
      <div class="mk" aria-hidden="true">
        <span class="rp"></span>
        <svg class="lb" viewBox="0 0 670 786"><defs><linearGradient id="lqb-gb" gradientUnits="userSpaceOnUse" x1="30" y1="290" x2="250" y2="740"><stop offset="0" style="stop-color:var(--b0)"/><stop offset="1" style="stop-color:var(--b1)"/></linearGradient></defs><path fill="url(#lqb-gb)" d="M2 271C93.4 468.0 228.1 416.0 251.0 545.0L251 743C76.1 695.7 -13.2 587.2 0.0 380.0L0 275Z"/></svg>
        <svg class="lc" viewBox="0 0 670 786"><defs><linearGradient id="lqb-gc" gradientUnits="userSpaceOnUse" x1="520" y1="210" x2="669" y2="780"><stop offset="0" style="stop-color:var(--c0)"/><stop offset=".45" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs><path fill="url(#lqb-gc)" d="M474 198C581.2 230.2 670.1 305.6 669.0 500.0L669 760C669 776 666 783 662 785L500 600L474 489Z"/></svg>
        <svg class="la" viewBox="0 0 670 786"><defs><linearGradient id="lqb-ga" gradientUnits="userSpaceOnUse" x1="60" y1="40" x2="650" y2="770"><stop offset="0" style="stop-color:var(--a0)"/><stop offset=".35" style="stop-color:var(--a1)"/><stop offset=".72" style="stop-color:var(--a2)"/><stop offset="1" style="stop-color:var(--a3)"/></linearGradient></defs><path fill="url(#lqb-ga)" d="M1 0C124.1 148.2 331.6 191.3 474.0 489.0L662 785C314.2 532.2 633.0 710.9 118.0 399.0C-22.3 290.2 2.6 200.5 0.0 150.0L0 4Z"/></svg>
      </div>
      <div class="wm" aria-hidden="true"><span style="animation-delay:1.2s">n</span><span style="animation-delay:1.25s">o</span><span style="animation-delay:1.3s">u</span><span style="animation-delay:1.35s">t</span><span style="animation-delay:1.4s">l</span><span style="animation-delay:1.45s">i</span><span style="animation-delay:1.5s">f</span><span style="animation-delay:1.55s">e</span></div>
      <div class="tg" aria-hidden="true">Orden en calma</div>
      <div class="bar" aria-hidden="true"><i></i></div>
    </div>
    <!-- Splash en el idioma de la visita (misma regla que src/lib/i18n): /en y /es ya traen el suyo
         (data-fixed-locale); en las demás rutas, el último idioma con que se vio la app o el del navegador.
         Los textos en inglés son los de src/lib/seo-meta (LANDING_META.en); una prueba lo comprueba. -->
    <script>
      try {
        if (!document.documentElement.getAttribute('data-fixed-locale')) {
          var ls = (JSON.parse(localStorage.getItem('lq-locale') || 'null') || {}).state || {};
          var lc = ls.last || ls.choice;
          if (!lc) {
            var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
            for (var li = 0; li < langs.length && !lc; li++) { var lb = String(langs[li]).slice(0, 2).toLowerCase(); if (lb === 'es' || lb === 'en') lc = lb; }
          }
          if ((lc || 'en') === 'en') {
            document.querySelector('#lq-boot .tg').textContent = 'Calm, in order';
            document.getElementById('lq-boot').setAttribute('aria-label', 'Loading NoutLife');
          }
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <!-- splash:boot -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
