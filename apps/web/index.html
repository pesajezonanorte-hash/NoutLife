    />
    <title>Noutlife — El RPG de tu vida real</title>
    <!-- Tema antes del primer pintado (misma lógica que store/themeStore) -->
    <script>
      try {
        var m = (JSON.parse(localStorage.getItem('lq-theme') || 'null') || {}).state;
        m = m && m.mode;
        if (!m) { var l = localStorage.getItem('theme'); m = l === 'dark' ? 'dark' : l === 'system' ? 'auto' : 'light'; }
        var d = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(d ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <!-- Splash estático mientras llega el JS: mismo layout que SplashScreen (ModernLoader). -->
    <style>
      #lq-boot { --bg: 249 247 243; --sf: 255 255 255; --bd: 219 231 222; --fg: 14 29 22; --mt: 79 107 92; --pr: 84 143 111; --pt: 61 105 80; --ok: 58 155 103; --in: 59 126 166; --wa: 212 149 42; --er: 200 70 63; --sa: .10; --sh: 0 12px 32px rgb(14 29 22 / .12), 0 4px 8px rgb(14 29 22 / .06);
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 0 16px; background: rgb(var(--bg)); color: rgb(var(--fg)); font-family: Montserrat, system-ui, sans-serif; }
      html.dark #lq-boot { --bg: 14 29 22; --sf: 20 38 29; --bd: 35 68 51; --fg: 230 242 232; --mt: 143 174 156; --pr: 133 199 161; --pt: 165 210 181; --ok: 127 211 160; --in: 127 182 214; --wa: 224 168 74; --er: 229 115 105; --sa: .16; --sh: 0 12px 32px rgb(0 0 0 / .45); }
      #lq-boot .b { display: flex; align-items: center; gap: 12px; font-size: 1.75rem; font-weight: 600; line-height: 1.5; }
      #lq-boot .m { display: flex; width: 40px; height: 40px; padding: 7px; overflow: hidden; border-radius: 12px; border: 1px solid rgb(var(--bd)); background: rgb(var(--sf)); box-sizing: border-box; }
      #lq-boot .m img { width: 100%; height: 100%; object-fit: contain; }
      #lq-boot .m .d, html.dark #lq-boot .m .l { display: none; }
      html.dark #lq-boot .m .d { display: block; }
      #lq-boot .t { width: 100%; max-width: 448px; height: 300px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgb(var(--bd)); border-radius: 16px; background: rgb(var(--sf)); box-shadow: var(--sh); box-sizing: border-box; }
      #lq-boot .h { height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid rgb(var(--bd)); }
      #lq-boot .h i { width: 12px; height: 12px; border-radius: 99px; display: inline-block; margin-right: 6px; }
      #lq-boot .h span { flex: 1; padding-right: 48px; text-align: center; font: 0.875rem/1.6 'JetBrains Mono', ui-monospace, monospace; color: rgb(var(--mt)); white-space: nowrap; overflow: hidden; }
      #lq-boot .c { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 16px 20px; overflow: hidden; }
      #lq-boot .c div { height: 20px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; opacity: 0; animation: lqb-in .2s ease-out forwards; }
      #lq-boot .c b { height: 12px; border-radius: 2px; opacity: .5; flex-shrink: 0; transform-origin: left; animation: lqb-grow .25s ease-out both; animation-delay: inherit; }
      #lq-boot .c .k { width: 2px; height: 14px; background: rgb(var(--pr)); animation: lqb-blink 1.06s steps(1) infinite; opacity: 1; }
      @keyframes lqb-in { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: none; } }
      @keyframes lqb-grow { from { transform: scaleX(0); } }
      @keyframes lqb-blink { 50% { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="lq-boot" role="status" aria-label="Preparando tu aventura">
        <div class="b" aria-hidden="true"><span class="m"><img class="l" src="/brand/noutlife-mark.svg" alt="" width="40" height="40" /><img class="d" src="/brand/noutlife-mark-on-dark.svg" alt="" width="40" height="40" /></span>Noutlife</div>
        <div class="t" aria-hidden="true">
          <div class="h"><span style="flex:none;padding:0;display:flex"><i style="background:rgb(var(--er))"></i><i style="background:rgb(var(--wa))"></i><i style="background:rgb(var(--ok));margin:0"></i></span><span>Iniciando tus herramientas…</span></div>
          <div class="c"><div style="animation-delay:0.1s"><b style="width:90px;background:rgb(var(--mt))"></b><b style="width:60px;background:rgb(var(--pr))"></b></div><div style="animation-delay:0.3s"><b style="width:70px;background:rgb(var(--ok))"></b><b style="width:110px;background:rgb(var(--mt))"></b><b style="width:55px;background:rgb(var(--in))"></b></div><div style="animation-delay:0.5s;padding-left:16px"><b style="width:120px;background:rgb(var(--pr))"></b></div><div style="animation-delay:0.7s;padding-left:16px"><b style="width:60px;background:rgb(var(--mt))"></b><b style="width:95px;background:rgb(var(--ok))"></b><b style="width:70px;background:rgb(var(--mt))"></b></div><div style="animation-delay:0.9s"><b style="width:85px;background:rgb(var(--in))"></b><b style="width:65px;background:rgb(var(--pr))"></b></div><div style="animation-delay:1.1s"><b style="width:100px;background:rgb(var(--mt))"></b></div><div style="animation-delay:1.3s"><b style="width:75px;background:rgb(var(--ok))"></b><b style="width:60px;background:rgb(var(--mt))"></b><b style="width:90px;background:rgb(var(--pr))"></b><b style="width:50px;background:rgb(var(--in))"></b></div><div style="animation-delay:1.5s;padding-left:16px"><b style="width:70px;background:rgb(var(--pr))"></b><b style="width:80px;background:rgb(var(--mt))"></b></div><div style="animation-delay:1.7s"><b class="k"></b></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
