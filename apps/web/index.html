    <!-- Open Graph. Esta cabecera es la de la raíz (x-default, en español). /en y /es tienen la suya:
         scripts/seo-pages.ts la escribe al compilar desde src/lib/seo-meta.ts (una prueba compara ambos). -->
    <meta property="og:type" content="website" />

    <meta property="og:locale" content="es_CO" />

    <link rel="canonical" href="https://noutlife.site/" />
    <link rel="alternate" hreflang="es" href="https://noutlife.site/es" />
    <link rel="alternate" hreflang="en" href="https://noutlife.site/en" />
    <link rel="alternate" hreflang="x-default" href="https://noutlife.site/" />
    <meta property="og:title" content="NoutLife — Tu rutina, tu mente y tus ideas en un solo lugar" />
    <meta property="og:description" content="Hábitos, libreta, bienestar y metas en un espacio en calma para ganar enfoque y claridad mental. Empieza gratis con 7 días de Pro, sin tarjeta." />
    <meta property="og:image" content="https://noutlife.site/og-image.png" />
    <meta property="og:image:secure_url" content="https://noutlife.site/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />

    <!-- Twitter -->

    <meta name="twitter:description" content="Hábitos, libreta, bienestar y metas en un espacio en calma para ganar enfoque y claridad mental. Empieza gratis con 7 días de Pro, sin tarjeta." />

    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>NoutLife — Tu rutina, tu mente y tus ideas en un solo lugar</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NoutLife",
        "alternateName": ["Noutlife"],
        "description": "Tu rutina, tu mente y tus ideas en un solo lugar: hábitos, libreta, bienestar y metas en un espacio en calma.",
        "inLanguage": "es",
        "url": "https://noutlife.site/",
        "image": "https://noutlife.site/og-image.png",
        "logo": "https://noutlife.site/icon.png"
      }
    </script>
    <meta name="google-site-verification" content="MyC3ZB7BGWD83R2TcF2oML6OxFE8rnFUE066NGibsAY" />
    <!-- Tema antes del primer pintado (misma lógica que store/themeStore) -->
    <script>
      try {
        var t = (JSON.parse(localStorage.getItem('lq-theme') || 'null') || {}).state || {};
        var m = t.mode;
        if (!m) { var l = localStorage.getItem('theme'); m = l === 'dark' ? 'dark' : l === 'light' ? 'light' : 'auto'; }
        var d = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        // Un tema de la Tienda fija su esquema (skinDark) y su data-theme.
        if (t.skin && typeof t.skinDark === 'boolean') { d = t.skinDark; document.documentElement.setAttribute('data-theme', t.skin); }
        document.documentElement.classList.add(d ? 'dark' : 'light');
        // Halloween para el splash (misma fecha que lib/season.ts).
        if (new Date() <= new Date('2026-10-31T23:59:59')) document.documentElement.setAttribute('data-season', 'halloween');
      } catch (e) {}
    </script>
    <!-- «Reducir movimiento» de la app antes del primer pintado (store/motionStore). -->
    <script>
      try { if ((JSON.parse(localStorage.getItem('lq-motion') || 'null') || {}).state.reduce) document.documentElement.classList.add('lq-rm'); } catch (e) {}
    </script>
    <!-- Splash de arranque. El primer pintado es CSS puro: la gota (.drop), el nombre y el eslogan. Cuando
         llega, src/splash/hero.ts dibuja en un Worker la escultura 3D encima y la gota se apaga: ella nace de
         esa misma masa. SplashScreen (React) solo avisa de cuándo salir. -->
    <style>
      /* Colores del tema puesto (tokens.css / skins.css, ya cargados en producción); los literales son Aurora. */
      #lq-boot { --bg: var(--lq-background, 249 247 243); --fg: var(--lq-on-background, 14 29 22); --mt: var(--lq-on-surface-light, 79 107 92);
        --d0: var(--lq-jade-100, 220 243 225); --d1: var(--lq-jade-200, 196 226 202); --d2: var(--lq-jade-300, 165 210 181); --ds: var(--lq-jade-900, 14 29 22);
        --hero: min(58vw, 36vh, 280px);
        position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        padding: 0 16px; background: rgb(var(--bg)); color: rgb(var(--fg)); font-family: Montserrat, system-ui, sans-serif; overflow: hidden;
        /* .999: si fuera opaco, el navegador no pintaría la app de debajo hasta que empiece a verse, justo en pleno vuelo. */
        opacity: .999; transition: opacity .5s cubic-bezier(.4,0,.2,1) var(--wait, 0s); }
      html.dark #lq-boot { --bg: var(--lq-background, 7 13 10); --fg: var(--lq-on-background, 230 242 232); --mt: var(--lq-on-surface-light, 143 174 156);
        --d0: var(--lq-jade-400, 133 199 161); --d1: var(--lq-jade-500, 112 180 141); --d2: var(--lq-jade-600, 84 143 111); --ds: 0 0 0; }
      #lq-boot.out { opacity: 0; pointer-events: none; }
      /* Sin 3D, la gota viaja dentro del splash: se apaga el fondo, no ella. */
      #lq-boot.out.fly { opacity: 1; background-color: transparent; transition: background-color .5s cubic-bezier(.4,0,.2,1); }
      #lq-boot .mk { display: grid; place-items: center; width: var(--hero); height: var(--hero); margin-bottom: 20px; }
      /* La gota: la misma masa translúcida de la que nace el 3D, del mismo tamaño (hero_mass en calm.py). */
      #lq-boot .drop { width: 58.6%; aspect-ratio: 1; border-radius: 50%; opacity: .92;
        background: radial-gradient(circle at 36% 30%, rgb(var(--d0)), rgb(var(--d1)) 52%, rgb(var(--d2)));
        box-shadow: inset 0 2px 6px rgb(255 255 255 / .55), inset -6px -10px 22px rgb(var(--d2) / .7), 14px 26px 46px -14px rgb(var(--ds) / .22);
        animation: lqb-drop 1.8s ease-in-out infinite alternate; transition: opacity .2s linear; }
      html.dark #lq-boot .drop { box-shadow: inset 0 2px 6px rgb(255 255 255 / .22), inset -6px -10px 22px rgb(0 0 0 / .3), 14px 26px 46px -14px rgb(var(--ds) / .6); }
      #lq-boot.born .drop { opacity: 0; animation-play-state: paused; }
      #lq-boot .wm { width: min(56vw, 224px); height: auto; overflow: visible; opacity: 0; animation: lqb-in 1.1s cubic-bezier(.33,0,.2,1) .45s both; }
      #lq-boot .tg { font-size: .9375rem; color: rgb(var(--mt)); opacity: 0; animation: lqb-in .9s cubic-bezier(.33,0,.2,1) 1s both; }
      #lq-boot.out .wm, #lq-boot.out .tg { animation: none; opacity: 0; transition: opacity .22s linear var(--wait, 0s); }
      #lq-boot-3d { position: fixed; inset: 0; z-index: 301; width: 100%; height: 100%; pointer-events: none; transition: opacity .16s linear; }
      /* La página espera a que la escultura se pose: el trazo de los títulos y el ambiente repintan cada fotograma,
         y el GPU, que es uno solo, daba tirones al vuelo. Al quitarse el splash, todo empieza a la vez. */
      html:has(#lq-boot) #root *, html:has(#lq-boot) #root *::before, html:has(#lq-boot) #root *::after { animation-play-state: paused !important; }
      @keyframes lqb-drop { from { transform: scale(.98); } to { transform: scale(1.02); } }
      @keyframes lqb-in { from { opacity: 0; } to { opacity: 1; } }
      /* Reducir movimiento: todo aparece con un fundido corto y la gota no late. */
      html.lq-rm #lq-boot .drop { animation: none; }
      html.lq-rm #lq-boot .wm, html.lq-rm #lq-boot .tg { animation-duration: .3s; animation-delay: 0s; }
    </style>
  </head>
  <body>
    <div id="lq-boot" role="status" aria-label="Cargando Noutlife">
      <div class="mk" aria-hidden="true"><div class="drop"></div></div>
      <svg class="wm" viewBox="-10 -10 486 120" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 100 L16 52 A22.5 22.5 0 0 1 59 58.5 V100"/><path d="M110 43.5a24.5 24.5 0 1 1 0 49a24.5 24.5 0 1 1 0-49"/><path d="M163.5 36v41.5a22.5 22.5 0 0 0 45 0V36M208.5 36v64"/><path d="M240 12v68a20 20 0 0 0 20 20M240 40h26"/><path d="M290 0v100"/><path d="M322 52v48"/><path d="M356 100V30a22 22 0 0 1 22-22h4M342 46h34"/><path d="M406 78 L449 56 A24.5 24.5 0 1 0 448.3 84.7"/><circle cx="322" cy="22" r="9" fill="currentColor" stroke="none"/></svg>
      <div class="tg" aria-hidden="true">Orden en calma</div>
    </div>
    <!-- Splash en el idioma de la visita (misma regla que src/lib/i18n): /en y /es ya traen el suyo
         (data-fixed-locale); en las demás rutas, el último idioma con que se vio la app o el del navegador.
         Los textos en inglés son los de src/lib/seo-meta (LANDING_META.en); una prueba lo comprueba. -->
    <script>
      try {
        if (!document.documentElement.getAttribute('data-fixed-locale')) {
          var ls = (JSON.parse(localStorage.getItem('lq-locale') || 'null') || {}).state || {};
          var lc = ls.last || ls.choice;
          if (!lc) {
            var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
            for (var li = 0; li < langs.length && !lc; li++) { var lb = String(langs[li]).slice(0, 2).toLowerCase(); if (lb === 'es' || lb === 'en') lc = lb; }
          }
          if ((lc || 'en') === 'en') {
            document.querySelector('#lq-boot .tg').textContent = 'Calm, in order';
            document.getElementById('lq-boot').setAttribute('aria-label', 'Loading NoutLife');
          }
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <!-- splash:boot -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
